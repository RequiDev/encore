<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Encore">
  <title>Encore</title>
  <!--
    A VU meter on a warm chassis: the amber needle is the same lamp the interface
    uses for its one accent. Drawn on a 64-unit grid with a safe margin so it
    survives being masked to a circle by a mobile launcher.
  -->
  <rect width="64" height="64" rx="14" fill="#1b1815"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#332d26" stroke-width="1.5"/>
  <path d="M15 43a17 17 0 0 1 34 0" fill="none" stroke="#6f655a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 43 45 21.5" fill="none" stroke="#f0a93b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="43" r="4" fill="#f0a93b"/>
  <circle cx="32" cy="43" r="1.5" fill="#1b1815"/>
</svg>
