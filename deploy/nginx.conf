server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are whole Spotify exports, which are routinely hundreds of
    # megabytes and occasionally several gigabytes. nginx's 1 MB default would
    # reject them before the API ever saw the request.
    client_max_body_size 8G;
    # Stream uploads straight through instead of spooling the whole body to disk
    # inside the proxy first; the API writes it to durable storage itself.
    proxy_request_buffering off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames make these safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz.txt {
        access_log off;
        add_header Content-Type text/plain;
    }

    # Same-origin API proxy. Because the browser only ever sees this origin, the
    # session cookie needs no cross-site relaxation.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An import upload of several gigabytes can legitimately take a while.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;
    }

    # Liveness and readiness are proxied so an external monitor can reach them
    # through the same entrypoint as everything else.
    location = /healthz { proxy_pass http://api:8080/healthz; }
    location = /readyz  { proxy_pass http://api:8080/readyz; }

    # Single-page application: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The index must never be cached, or a deploy leaves browsers pinned to the
    # previous bundle's asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
