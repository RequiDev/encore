# When something else terminates TLS in front of this container, the client's
# scheme arrives in X-Forwarded-Proto. Setting it from $scheme unconditionally
# would overwrite "https" with this container's own "http", which is wrong for
# anything downstream that reads it.
map $http_x_forwarded_proto $encore_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the API's address on every request instead of once at startup.
    #
    # nginx resolves a literal hostname in proxy_pass exactly once, when it reads
    # its configuration, and then caches that address for the life of the
    # process. Container addresses are not stable: `docker compose up --build`,
    # a restart, or a crash all give the API a new one, and the old address is
    # frequently handed straight to another container. nginx then proxies to the
    # wrong container forever — in this stack it reaches the worker, which serves
    # 8081 rather than 8080, so every /api request fails with "connection
    # refused" until nginx itself is restarted.
    #
    # Naming the upstream through a variable defers resolution to request time,
    # and 127.0.0.11 is Docker's embedded DNS server on any user-defined network,
    # which is what Compose always creates. IPv6 is disabled because the embedded
    # resolver answers AAAA queries that then fail to connect.
    #
    # A variable in proxy_pass also disables nginx's implicit URI rewriting, so
    # every proxy_pass below states the upstream URI explicitly.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $encore_api api;

    # Uploads are whole Spotify exports, which are routinely hundreds of
    # megabytes and occasionally several gigabytes. nginx's 1 MB default would
    # reject them before the API ever saw the request.
    client_max_body_size 8G;
    # Stream uploads straight through instead of spooling the whole body to disk
    # inside the proxy first; the API writes it to durable storage itself.
    proxy_request_buffering off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames make these safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz.txt {
        access_log off;
        add_header Content-Type text/plain;
    }

    # Same-origin API proxy. Because the browser only ever sees this origin, the
    # session cookie needs no cross-site relaxation.
    location /api/ {
        # $request_uri carries the original path and query string, which the
        # implicit form would have forwarded for us.
        proxy_pass http://$encore_api:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $encore_proto;
        # An import upload of several gigabytes can legitimately take a while.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;
    }

    # Liveness and readiness are proxied so an external monitor can reach them
    # through the same entrypoint as everything else.
    location = /healthz { proxy_pass http://$encore_api:8080/healthz; }
    location = /readyz  { proxy_pass http://$encore_api:8080/readyz; }

    # Single-page application: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The index must never be cached, or a deploy leaves browsers pinned to the
    # previous bundle's asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
