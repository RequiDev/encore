# Encore as a single Compose file, for Portainer's stack web editor.
#
# GENERATED - do not edit. Regenerate with ./scripts/gen-portainer-stack.sh
#
# This is docker-compose.yml + docker-compose.server.yml flattened, because the
# stack editor takes exactly one file. CI fails if this copy stops matching the
# two it comes from.
#
# Portainer: Stacks -> Add stack -> Web editor. Paste this in, then fill in the
# values below under "Environment variables". Nothing is built on the server:
# the images are pulled from ghcr.io, so no source checkout is needed.
#
# Required:
#   ENCORE_PUBLIC_URL, ENCORE_WEB_URL, ENCORE_SPOTIFY_CLIENT_ID,
#   ENCORE_SPOTIFY_CLIENT_SECRET, ENCORE_ENCRYPTION_KEY, POSTGRES_PASSWORD
#
# Behind a reverse proxy, also set:
#   ENCORE_BIND_ADDR=127.0.0.1  and  ENCORE_COOKIE_SECURE=true
#
# Reference: docs/configuration.md and docs/deployment.md

services:
  api:
    command:
      - /usr/local/bin/encore-api
    depends_on:
      db:
        condition: service_healthy
        required: true
      migrate:
        condition: service_completed_successfully
        required: true
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      ENCORE_COOKIE_SECURE: ${ENCORE_COOKIE_SECURE:-false}
      ENCORE_DATABASE_URL: postgres://encore:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/encore?sslmode=disable
      ENCORE_DEFAULT_TIMEZONE: ${ENCORE_DEFAULT_TIMEZONE:-UTC}
      ENCORE_ENCRYPTION_KEY: ${ENCORE_ENCRYPTION_KEY:?set ENCORE_ENCRYPTION_KEY in .env}
      ENCORE_ENRICH_ENABLED: ${ENCORE_ENRICH_ENABLED:-true}
      ENCORE_ENV: ${ENCORE_ENV:-production}
      ENCORE_IMPORT_BATCH_SIZE: ${ENCORE_IMPORT_BATCH_SIZE:-1000}
      ENCORE_IMPORT_DIR: /var/lib/encore/imports
      ENCORE_IMPORT_MAX_UPLOAD_BYTES: ${ENCORE_IMPORT_MAX_UPLOAD_BYTES:-4gb}
      ENCORE_IMPORT_MIN_MS: ${ENCORE_IMPORT_MIN_MS:-1000}
      ENCORE_LOG_FORMAT: ${ENCORE_LOG_FORMAT:-json}
      ENCORE_LOG_LEVEL: ${ENCORE_LOG_LEVEL:-info}
      ENCORE_METRICS_ENABLED: ${ENCORE_METRICS_ENABLED:-true}
      ENCORE_METRICS_PASSWORD: ${ENCORE_METRICS_PASSWORD:-}
      ENCORE_METRICS_USERNAME: ${ENCORE_METRICS_USERNAME:-}
      ENCORE_PUBLIC_URL: ${ENCORE_PUBLIC_URL:?set ENCORE_PUBLIC_URL in .env}
      ENCORE_REGISTRATIONS_DEFAULT: ${ENCORE_REGISTRATIONS_DEFAULT:-true}
      ENCORE_SPOTIFY_CLIENT_ID: ${ENCORE_SPOTIFY_CLIENT_ID:?set ENCORE_SPOTIFY_CLIENT_ID in .env}
      ENCORE_SPOTIFY_CLIENT_SECRET: ${ENCORE_SPOTIFY_CLIENT_SECRET:?set ENCORE_SPOTIFY_CLIENT_SECRET in .env}
      ENCORE_SYNC_ENABLED: ${ENCORE_SYNC_ENABLED:-true}
      ENCORE_SYNC_INTERVAL: ${ENCORE_SYNC_INTERVAL:-60s}
      ENCORE_TRUST_PROXY_HEADERS: "true"
      ENCORE_WEB_URL: ${ENCORE_WEB_URL:?set ENCORE_WEB_URL in .env}
      TZ: ${ENCORE_DEFAULT_TIMEZONE:-UTC}
    healthcheck:
      interval: 10s
      retries: 6
      start_period: 15s
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      timeout: 5s
    image: ${ENCORE_IMAGE:-ghcr.io/requidev/encore}:${ENCORE_VERSION:-latest}
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      default: null
    ports:
      - ${ENCORE_BIND_ADDR:-0.0.0.0}:${ENCORE_API_PORT:-8080}:8080
    restart: always
    volumes:
      - source: encore-imports
        target: /var/lib/encore/imports
        type: volume
        volume: {}
  db:
    environment:
      PGTZ: UTC
      POSTGRES_DB: encore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: encore
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 10s
      test:
        - CMD-SHELL
        - pg_isready -U encore -d encore
      timeout: 5s
    image: postgres:17-alpine
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      default: null
    pull_policy: missing
    restart: always
    volumes:
      - source: encore-db
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  migrate:
    command:
      - /usr/local/bin/encore-migrate
      - up
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      ENCORE_COOKIE_SECURE: ${ENCORE_COOKIE_SECURE:-false}
      ENCORE_DATABASE_URL: postgres://encore:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/encore?sslmode=disable
      ENCORE_DEFAULT_TIMEZONE: ${ENCORE_DEFAULT_TIMEZONE:-UTC}
      ENCORE_ENCRYPTION_KEY: ${ENCORE_ENCRYPTION_KEY:?set ENCORE_ENCRYPTION_KEY in .env}
      ENCORE_ENRICH_ENABLED: ${ENCORE_ENRICH_ENABLED:-true}
      ENCORE_ENV: ${ENCORE_ENV:-production}
      ENCORE_IMPORT_BATCH_SIZE: ${ENCORE_IMPORT_BATCH_SIZE:-1000}
      ENCORE_IMPORT_DIR: /var/lib/encore/imports
      ENCORE_IMPORT_MAX_UPLOAD_BYTES: ${ENCORE_IMPORT_MAX_UPLOAD_BYTES:-4gb}
      ENCORE_IMPORT_MIN_MS: ${ENCORE_IMPORT_MIN_MS:-1000}
      ENCORE_LOG_FORMAT: ${ENCORE_LOG_FORMAT:-json}
      ENCORE_LOG_LEVEL: ${ENCORE_LOG_LEVEL:-info}
      ENCORE_METRICS_ENABLED: ${ENCORE_METRICS_ENABLED:-true}
      ENCORE_METRICS_PASSWORD: ${ENCORE_METRICS_PASSWORD:-}
      ENCORE_METRICS_USERNAME: ${ENCORE_METRICS_USERNAME:-}
      ENCORE_PUBLIC_URL: ${ENCORE_PUBLIC_URL:?set ENCORE_PUBLIC_URL in .env}
      ENCORE_REGISTRATIONS_DEFAULT: ${ENCORE_REGISTRATIONS_DEFAULT:-true}
      ENCORE_SPOTIFY_CLIENT_ID: ${ENCORE_SPOTIFY_CLIENT_ID:?set ENCORE_SPOTIFY_CLIENT_ID in .env}
      ENCORE_SPOTIFY_CLIENT_SECRET: ${ENCORE_SPOTIFY_CLIENT_SECRET:?set ENCORE_SPOTIFY_CLIENT_SECRET in .env}
      ENCORE_SYNC_ENABLED: ${ENCORE_SYNC_ENABLED:-true}
      ENCORE_SYNC_INTERVAL: ${ENCORE_SYNC_INTERVAL:-60s}
      ENCORE_TRUST_PROXY_HEADERS: "true"
      ENCORE_WEB_URL: ${ENCORE_WEB_URL:?set ENCORE_WEB_URL in .env}
      TZ: ${ENCORE_DEFAULT_TIMEZONE:-UTC}
    image: ${ENCORE_IMAGE:-ghcr.io/requidev/encore}:${ENCORE_VERSION:-latest}
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      default: null
    restart: "no"
  web:
    depends_on:
      api:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      interval: 10s
      retries: 6
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/healthz.txt
      timeout: 5s
    image: ${ENCORE_WEB_IMAGE:-ghcr.io/requidev/encore-web}:${ENCORE_VERSION:-latest}
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      default: null
    ports:
      - ${ENCORE_BIND_ADDR:-0.0.0.0}:${ENCORE_WEB_PORT:-3000}:80
    restart: always
  worker:
    command:
      - /usr/local/bin/encore-worker
    depends_on:
      db:
        condition: service_healthy
        required: true
      migrate:
        condition: service_completed_successfully
        required: true
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      ENCORE_COOKIE_SECURE: ${ENCORE_COOKIE_SECURE:-false}
      ENCORE_DATABASE_URL: postgres://encore:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/encore?sslmode=disable
      ENCORE_DEFAULT_TIMEZONE: ${ENCORE_DEFAULT_TIMEZONE:-UTC}
      ENCORE_ENCRYPTION_KEY: ${ENCORE_ENCRYPTION_KEY:?set ENCORE_ENCRYPTION_KEY in .env}
      ENCORE_ENRICH_ENABLED: ${ENCORE_ENRICH_ENABLED:-true}
      ENCORE_ENV: ${ENCORE_ENV:-production}
      ENCORE_HTTP_ADDR: :8081
      ENCORE_IMPORT_BATCH_SIZE: ${ENCORE_IMPORT_BATCH_SIZE:-1000}
      ENCORE_IMPORT_DIR: /var/lib/encore/imports
      ENCORE_IMPORT_MAX_UPLOAD_BYTES: ${ENCORE_IMPORT_MAX_UPLOAD_BYTES:-4gb}
      ENCORE_IMPORT_MIN_MS: ${ENCORE_IMPORT_MIN_MS:-1000}
      ENCORE_LOG_FORMAT: ${ENCORE_LOG_FORMAT:-json}
      ENCORE_LOG_LEVEL: ${ENCORE_LOG_LEVEL:-info}
      ENCORE_METRICS_ENABLED: ${ENCORE_METRICS_ENABLED:-true}
      ENCORE_METRICS_PASSWORD: ${ENCORE_METRICS_PASSWORD:-}
      ENCORE_METRICS_USERNAME: ${ENCORE_METRICS_USERNAME:-}
      ENCORE_PUBLIC_URL: ${ENCORE_PUBLIC_URL:?set ENCORE_PUBLIC_URL in .env}
      ENCORE_REGISTRATIONS_DEFAULT: ${ENCORE_REGISTRATIONS_DEFAULT:-true}
      ENCORE_SPOTIFY_CLIENT_ID: ${ENCORE_SPOTIFY_CLIENT_ID:?set ENCORE_SPOTIFY_CLIENT_ID in .env}
      ENCORE_SPOTIFY_CLIENT_SECRET: ${ENCORE_SPOTIFY_CLIENT_SECRET:?set ENCORE_SPOTIFY_CLIENT_SECRET in .env}
      ENCORE_SYNC_ENABLED: ${ENCORE_SYNC_ENABLED:-true}
      ENCORE_SYNC_INTERVAL: ${ENCORE_SYNC_INTERVAL:-60s}
      ENCORE_TRUST_PROXY_HEADERS: "true"
      ENCORE_WEB_URL: ${ENCORE_WEB_URL:?set ENCORE_WEB_URL in .env}
      ENCORE_WORKER_ID: worker-1
      TZ: ${ENCORE_DEFAULT_TIMEZONE:-UTC}
    healthcheck:
      interval: 10s
      retries: 6
      start_period: 15s
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8081/healthz
      timeout: 5s
    image: ${ENCORE_IMAGE:-ghcr.io/requidev/encore}:${ENCORE_VERSION:-latest}
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      default: null
    restart: always
    volumes:
      - source: encore-imports
        target: /var/lib/encore/imports
        type: volume
        volume: {}
volumes:
  encore-db:
  encore-imports:
x-encore-env:
