# Run Encore from the published images instead of building from source.
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Combine it with the production overlay on a server:
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml \
#                  -f docker-compose.prod.yml up -d
#
# The images are public, so no docker login is needed to pull them.
#
# `build: !reset null` removes the build section the base file declares. Without
# it Compose would still rebuild from source whenever the local image is missing,
# which on a server without the source checked out fails confusingly.

services:
  migrate:
    build: !reset null
    image: ghcr.io/requidev/encore:${ENCORE_VERSION:-latest}

  api:
    build: !reset null
    image: ghcr.io/requidev/encore:${ENCORE_VERSION:-latest}

  worker:
    build: !reset null
    image: ghcr.io/requidev/encore:${ENCORE_VERSION:-latest}

  web:
    build: !reset null
    image: ghcr.io/requidev/encore-web:${ENCORE_VERSION:-latest}
