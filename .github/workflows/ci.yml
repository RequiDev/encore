name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The Portainer stack is a flattened copy of three Compose files, so it can
      # drift silently the moment one of them changes. Regenerating and diffing
      # is what stops someone deploying a stale stack from the web editor.
      - name: The Portainer stack file is up to date
        run: |
          bash ./scripts/gen-portainer-stack.sh
          git diff --exit-code docker-compose.portainer.yml             || { echo "docker-compose.portainer.yml is stale; run ./scripts/gen-portainer-stack.sh"; exit 1; }

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore
          POSTGRES_DB: encore
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U encore -d encore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENCORE_DATABASE_URL: postgres://encore:encore@localhost:5432/encore?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Apply migrations
        run: go run ./cmd/encore-migrate up
      - name: Report status
        run: go run ./cmd/encore-migrate status
      # Applying twice must be a no-op: that is what makes a rolling upgrade safe.
      - name: Re-apply is idempotent
        run: go run ./cmd/encore-migrate up
      # Down then up proves the down migrations are not silently broken.
      - name: Roll all the way down and back up
        run: |
          go run ./cmd/encore-migrate reset --yes
          go run ./cmd/encore-migrate up

  integration:
    name: Integration and import tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore
          POSTGRES_DB: encore
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U encore -d encore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENCORE_TEST_DATABASE_URL: postgres://encore:encore@localhost:5432/encore?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Integration tests
        # -p 1 runs the test packages one at a time. They share one database and
        # truncate it between tests, so two packages running at once would wipe
        # each other's fixtures mid-assertion.
        run: go test -tags=integration -race -count=1 -p 1 -timeout=20m ./test/...

  benchmark:
    name: Large synthetic import benchmark
    runs-on: ubuntu-latest
    # The million-record benchmark takes several minutes, so it runs on main and
    # on demand rather than on every pull request.
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore
          POSTGRES_DB: encore
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U encore -d encore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENCORE_DATABASE_URL: postgres://encore:encore@localhost:5432/encore?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Apply migrations
        run: go run ./cmd/encore-migrate up
      - name: Import one million synthetic records
        run: go run ./cmd/encore-bench run --records 1000000 --format extended --report bench.json
      - name: Publish benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: import-benchmark
          path: bench.json

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  images:
    name: Container images
    runs-on: ubuntu-latest
    # Only publish something every other job agreed was good. A broken image in a
    # registry is worse than no image: someone will pull it.
    needs: [lint, unit, migrations, integration, web]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: encore
            dockerfile: deploy/Dockerfile
            description: Encore API, worker and migration binaries
          - name: encore-web
            dockerfile: deploy/web.Dockerfile
            description: Encore web client behind nginx
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Container references must be lowercase; GitHub account names need not be.
      - name: Resolve the image name
        id: image
        run: echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # A pull request from a fork has no write access to the registry, and should
      # not have. It still builds, so the Dockerfile is verified either way.
      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 covers a Raspberry Pi or an Apple-silicon host. Both stages
          # cross-compile rather than emulate, so this costs little.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      # Signed evidence of which workflow and which commit produced the digest,
      # which is what makes a public image auditable by whoever pulls it.
      - name: Attest the build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Published image starts
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      # Publishing an image that cannot start is the failure mode this catches:
      # everything above tests the source, nothing tests the artefact.
      - name: Pull and run the migration binary against a real database
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker run -d --name pg -e POSTGRES_USER=encore -e POSTGRES_PASSWORD=encore             -e POSTGRES_DB=encore -e PGTZ=UTC --network host postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U encore -d encore && break
            sleep 2
          done
          docker run --rm --network host             -e ENCORE_DATABASE_URL='postgres://encore:encore@localhost:5432/encore?sslmode=disable'             "ghcr.io/$owner/encore:sha-${{ github.sha }}"             /usr/local/bin/encore-migrate up
          docker run --rm --network host             -e ENCORE_DATABASE_URL='postgres://encore:encore@localhost:5432/encore?sslmode=disable'             "ghcr.io/$owner/encore:sha-${{ github.sha }}"             /usr/local/bin/encore-migrate status
