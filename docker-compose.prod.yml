# Production overlay for a long-running server.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Everything else a reverse-proxied deployment needs is plain configuration and
# lives in .env — ENCORE_BIND_ADDR, ENCORE_COOKIE_SECURE, ENCORE_TRUST_PROXY_HEADERS.
# See docs/deployment.md. This file exists for the settings that cannot be
# expressed as environment variables.

x-logging: &logging
  # Docker's default json-file driver grows without limit, which on a home
  # server that runs for months is a slow way to fill the disk. Encore logs one
  # structured line per request, so 50 MB per service is a generous ceiling.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *logging
    restart: always
    # A rebuilt image should never silently replace the database.
    pull_policy: missing

  migrate:
    <<: *logging

  api:
    <<: *logging
    restart: always
    # Import uploads stream to disk rather than into memory, and statistics are
    # aggregated by PostgreSQL, so the API itself stays small. The limit is here
    # to make a leak visible as a restart rather than as a dead server.
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: *logging
    restart: always
    # Peak import heap is single-digit megabytes at the default batch size; see
    # docs/benchmarks.md. 512M leaves room for the Go runtime and a raised
    # ENCORE_IMPORT_BATCH_SIZE.
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    <<: *logging
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
